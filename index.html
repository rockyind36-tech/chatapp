<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ChatApp</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <!-- AUTH SECTION -->

  <main
    id="auth-section"
    class="auth-section"
  >

    <div class="auth-card">

      <div class="auth-logo">
        💬
      </div>

      <h1>
        ChatApp
      </h1>

      <p class="auth-subtitle">
        Connect with your people
      </p>


      <input
        id="name"
        type="text"
        placeholder="Full name"
        autocomplete="name"
      />

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <div class="auth-buttons">

        <button
          id="login-btn"
          type="button"
        >
          Login
        </button>

        <button
          id="signup-btn"
          type="button"
          class="secondary-btn"
        >
          Create Account
        </button>

      </div>

      <p
        id="auth-message"
        class="auth-message"
      ></p>

    </div>

  </main>


  <!-- CHAT SECTION -->

  <main
    id="chat-section"
    class="chat-section hidden"
  >

    <div class="chat-layout">


      <!-- LEFT SIDEBAR -->

      <aside class="sidebar">

        <div class="sidebar-header">

          <div class="my-profile">

            <div class="avatar avatar-wrapper">

              <span id="my-avatar">
                U
              </span>

              <span
                id="my-online-dot"
                class="online-dot"
              ></span>

            </div>

            <div class="my-profile-text">

              <strong id="current-user">
                User
              </strong>

              <small>
                My account
              </small>

            </div>

          </div>

          <button
            id="logout-btn"
            class="logout-btn"
            type="button"
            title="Logout"
          >
            Logout
          </button>

        </div>


        <div class="search-box">

          <span class="search-icon">
            🔍
          </span>

          <input
            id="user-search"
            type="search"
            placeholder="Search name, email or number"
            autocomplete="off"
          />

        </div>


        <div class="users-heading">

          <strong>
            Contacts
          </strong>

          <span id="users-count">
            0
          </span>

        </div>


        <div
          id="users-list"
          class="users-list"
        >

          <p class="no-user">
            No users found
          </p>

        </div>

      </aside>


      <!-- RIGHT CHAT AREA -->

      <section class="chat-area">


        <!-- CHAT HEADER -->

        <header class="chat-header">

          <div class="chat-user-info">

            <div
              id="chat-avatar"
              class="avatar small-avatar"
            >
              ?
            </div>

            <div class="chat-user-details">

              <strong id="chat-title">
                Select a user
              </strong>

              <small id="chat-status">
                Choose someone to start chatting
              </small>

              <small
                id="chat-last-seen"
                class="chat-last-seen"
              ></small>

              <small
                id="typing-indicator"
                class="typing-indicator hidden"
              >
                typing...
              </small>

            </div>

          </div>


          <!-- HEADER ACTIONS -->

          <div class="chat-actions">

            <button
              id="audio-call-btn"
              class="header-icon-btn"
              type="button"
              title="Audio call"
              disabled
            >
              📞
            </button>

            <button
              id="video-call-btn"
              class="header-icon-btn"
              type="button"
              title="Video call"
              disabled
            >
              📹
            </button>

            <button
              id="chat-menu-btn"
              class="header-icon-btn"
              type="button"
              title="Chat menu"
              disabled
            >
              ⋮
            </button>


            <!-- MAIN CHAT MENU -->

            <div
              id="chat-menu"
              class="chat-menu hidden"
            >

              <button
                id="new-group-btn"
                type="button"
              >
                New group
              </button>

              <button
                id="view-contact-btn"
                type="button"
              >
                View contact
              </button>

              <button
                id="chat-theme-btn"
                type="button"
              >
                Chat theme
              </button>

              <div class="menu-divider"></div>

              <button
                id="more-menu-btn"
                type="button"
              >
                More
              </button>


              <!-- MORE SUBMENU -->

              <div
                id="more-menu"
                class="more-menu hidden"
              >

                <button
                  id="report-user-btn"
                  type="button"
                >
                  Report
                </button>

                <button
                  id="block-user-btn"
                  type="button"
                >
                  Block
                </button>

                <button
                  id="clear-chat-btn"
                  type="button"
                >
                  Clear chat
                </button>

              </div>

            </div>

          </div>

        </header>


        <!-- MESSAGES -->

        <div
          id="messages"
          class="messages"
        >

          <div class="empty-chat">

            <div class="empty-icon">
              💬
            </div>

            <h2>
              Start a conversation
            </h2>

            <p>
              Search and select a user from the left side.
            </p>

          </div>

        </div>


        <!-- MESSAGE COMPOSER -->

        <form
          id="message-form"
          class="message-form"
        >

          <input
            id="message-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
          />

          <button
            type="submit"
            class="send-btn"
            title="Send message"
          >
            ➤
          </button>

        </form>

      </section>

    </div>

  </main>


  <!-- CALL MODAL -->

  <div
    id="call-modal"
    class="call-modal hidden"
  >

    <div class="call-card">

      <div class="call-card-header">

        <h3>
          Call
        </h3>

        <span>
          Secure connection
        </span>

      </div>


      <div class="video-stage">

        <video
          id="remote-video"
          autoplay
          playsinline
        ></video>

        <video
          id="local-video"
          autoplay
          muted
          playsinline
        ></video>

        <div
          id="audio-call-placeholder"
          class="audio-call-placeholder"
        >
          📞
        </div>

      </div>


      <div class="call-controls">

        <button
          id="accept-call-btn"
          type="button"
          class="accept-call-btn"
        >
          Accept
        </button>

        <button
          id="reject-call-btn"
          type="button"
          class="reject-call-btn"
        >
          Reject
        </button>

        <button
          id="end-call-btn"
          type="button"
          class="end-call-btn"
        >
          End call
        </button>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
